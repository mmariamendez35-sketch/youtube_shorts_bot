name: Publish YouTube Shorts

on:
  schedule:
    - cron: '0 13,17,21,0 * * *'   # UTC times for 8:00,12:00,17:00,21:00 Colombia (UTC-5) -> add 5h => 13,17,21,0 UTC
    # Adjust as needed for daylight savings (Colombia does not observe DST)
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional custom topic for the short (overrides auto‑selected)'
        required: false
        default: ''

jobs:
  publish_shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare YouTube token JSON
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          echo "$YOUTUBE_TOKEN_JSON" > youtube_token.json

      - name: Prepare client secret JSON
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
        run: |
          echo "$CLIENT_SECRET_JSON" > client_secret.json

      - name: Run orchestrator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/main.py "${{ github.event.inputs.topic }}"
