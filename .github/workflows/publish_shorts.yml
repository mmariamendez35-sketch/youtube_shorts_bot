name: Publish YouTube Content — Oraciones que transforman

on:
  schedule:
    # ── SHORTS (Horarios de mayor consumo según estudio de audiencia espiritual) ──
    - cron: '0 11 * * *'    # 6:00 AM COL  — Oración de la Mañana (Al despertar)
    - cron: '0 17 * * *'    # 12:00 PM COL — Oración del Mediodía (Pausa laboral)
    - cron: '0 23 * * *'    # 6:00 PM COL  — Oración de la Tarde / Regreso a casa
    - cron: '0 2 * * *'     # 9:00 PM COL  — Oración de la Noche (Antes de dormir)
    # ── VIDEO LARGO (Horario pico de retención y tiempo libre) ──
    - cron: '0 1 * * *'     # 8:00 PM COL  — Oración Profunda de 10-15 min
  workflow_dispatch:
    inputs:
      format:
        description: 'Video format: "short" or "long"'
        required: false
        default: 'short'
      topic:
        description: 'Optional custom topic (overrides auto‑selected)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto fonts-freefont-ttf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare YouTube credentials
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
        run: |
          echo "$YOUTUBE_TOKEN_JSON" > youtube_token.json
          echo "$CLIENT_SECRET_JSON" > client_secret.json

      - name: Determine video format
        id: format
        run: |
          CRON="${{ github.event.schedule }}"
          INPUT_FMT="${{ github.event.inputs.format }}"
          if [ -n "$INPUT_FMT" ]; then
            echo "fmt=$INPUT_FMT" >> $GITHUB_OUTPUT
          elif [ "$CRON" = "0 1 * * *" ]; then
            echo "fmt=long" >> $GITHUB_OUTPUT
          else
            echo "fmt=short" >> $GITHUB_OUTPUT
          fi

      - name: Run orchestrator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/main.py "${{ steps.format.outputs.fmt }}" "${{ github.event.inputs.topic }}"

      - name: Save publish history
        if: always()
        run: |
          if [ -f publish_history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add publish_history.json
            git diff --cached --quiet || git commit -m "📝 Update publish history [skip ci]"
            git push origin main || true
          fi
